<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK 听力 iOS 原型 v1.6</title>
  <style>
    :root {
      --red: #D93025;
      --red-dark: #B91C1C;
      --red-soft: #FDECEC;
      --green: #22C55E;
      --green-soft: #DCFCE7;
      --gray-50: #F8FAFC;
      --gray-100: #F1F5F9;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-500: #6B7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --shadow: 0 16px 40px rgba(17, 24, 39, 0.16);
      --card-shadow: 0 10px 24px rgba(17, 24, 39, 0.08);
      --radius: 18px;
      --phone-w: 390px;
      --phone-h: 844px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #fff6f5 0, #f5f7fb 45%, #e8edf7 100%);
      color: var(--gray-900);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 28px;
    }
    .brief {
      width: 310px;
      max-width: 36vw;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .brief h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.25; }
    .brief p { margin: 8px 0; color: var(--gray-500); font-size: 14px; line-height: 1.65; }
    .screen-jump { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .jump-btn {
      border: 0;
      background: #fff;
      border-radius: 14px;
      padding: 10px 8px;
      color: var(--gray-700);
      box-shadow: 0 6px 14px rgba(17,24,39,.06);
      cursor: pointer;
      font-weight: 650;
      font-size: 12px;
    }
    .jump-btn:hover { color: var(--red); transform: translateY(-1px); }
    .phone-frame {
      width: calc(var(--phone-w) + 26px);
      height: calc(var(--phone-h) + 26px);
      background: #111;
      border-radius: 48px;
      padding: 13px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .28);
      position: relative;
    }
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      background: var(--gray-50);
      border-radius: 36px;
      overflow: hidden;
      position: relative;
    }
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 36px;
      background: #0B0B0B;
      border-radius: 22px;
      z-index: 50;
    }
    .app {
      position: absolute;
      inset: 0;
      background: var(--gray-50);
      overflow: hidden;
    }
    .status-bar {
      height: 54px;
      padding: 16px 24px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
      color: rgba(17,24,39,.92);
      pointer-events: none;
      z-index: 20;
      position: relative;
    }
    .status-icons { display: flex; gap: 5px; align-items: center; }
    .signal { width: 18px; height: 10px; display: inline-grid; grid-template-columns: repeat(4, 3px); gap: 2px; align-items: end; }
    .signal span { background: currentColor; border-radius: 2px; }
    .signal span:nth-child(1){height:3px}.signal span:nth-child(2){height:5px}.signal span:nth-child(3){height:7px}.signal span:nth-child(4){height:10px}
    .battery { width: 22px; height: 11px; border: 1.8px solid currentColor; border-radius: 3px; position: relative; }
    .battery::before { content:""; position:absolute; right:-4px; top:3px; width:2px; height:5px; background:currentColor; border-radius:0 2px 2px 0; }
    .battery::after { content:""; position:absolute; left:2px; top:2px; width:14px; height:5px; background:currentColor; border-radius:2px; }
    .nav {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: relative;
      z-index: 18;
    }
    .nav-title { position:absolute; left:80px; right:80px; text-align:center; font-size:17px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nav-btn { border:0; background:transparent; color: #111827; height: 40px; min-width: 40px; border-radius: 20px; display:flex; align-items:center; justify-content:center; font-size: 15px; font-weight: 750; cursor:pointer; }
    .nav-text-btn { background: rgba(255,255,255,.92); padding: 0 12px; min-width: auto; box-shadow: 0 6px 16px rgba(17,24,39,.08); }
    .nav-btn:active { background: rgba(0,0,0,.05); }
    .nav-btn.red { color: var(--red); }
    .hero {
      margin: -102px 0 0;
      padding: 116px 22px 28px;
      min-height: 214px;
      background: linear-gradient(155deg, #E6362B 0%, #C91F1B 64%, #B30F18 100%);
      color: white;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      position: relative;
      overflow: hidden;
    }
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
    }
    .hero::before { width: 180px; height: 180px; right: -42px; top: 66px; }
    .hero::after { width: 80px; height: 80px; left: 24px; bottom: -28px; }
    .hero-content { position: relative; z-index: 1; text-align: center; padding-top: 18px; }
    .hero h2 { font-size: 25px; line-height: 1.18; margin: 0; letter-spacing: .2px; }
    .hero p { margin: 8px 0 0; color: rgba(255,255,255,.86); font-size: 13px; }
    .content {
      position: absolute;
      left: 0; right: 0; top: 54px; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 24px;
    }
    .content.has-nav { top: 54px; }
    .after-hero { padding: 14px 18px 28px; }
    .level-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-wrap: nowrap;
      touch-action: pan-x;
      padding: 2px 0 14px;
      scrollbar-width: none;
      white-space: nowrap;
    }
    .level-tabs::-webkit-scrollbar { display:none; }
    .level-chip {
      flex: 0 0 auto;
      border: 1px solid transparent;
      min-width: 72px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #fff;
      color: var(--gray-500);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(17,24,39,.06);
      scroll-snap-align: start;
    }
    .level-chip.active { color: var(--red); background: var(--red-soft); border-color: rgba(217,48,37,.18); }
    .section-head { display:flex; align-items:flex-end; justify-content:space-between; margin: 4px 0 12px; }
    .section-head h3 { margin:0; font-size:18px; }
    .section-head span { color: var(--gray-500); font-size:12px; font-weight:650; }
    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(229,231,235,.72);
    }
    .paper-card, .part-card {
      padding: 17px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
      position: relative;
      overflow: hidden;
    }
    .paper-card:active, .part-card:active { transform: scale(.985); }
    .paper-row, .part-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .paper-code, .part-title { font-weight: 900; font-size: 17px; margin-bottom: 4px; }
    .sub { color: var(--gray-500); font-size: 12px; line-height: 1.45; }
    .arrow { color: var(--gray-300); font-size: 22px; padding-top:4px; }
    .progress-meta { display:flex; justify-content:space-between; margin: 13px 0 7px; color: var(--gray-500); font-weight:700; font-size:12px; }
    .progress { height: 8px; background: var(--gray-100); border-radius: 999px; overflow:hidden; }
    .progress div { height:100%; background: linear-gradient(90deg, var(--red), #FF7A70); border-radius:999px; }
    .badge { display:inline-flex; align-items:center; gap:4px; padding: 6px 9px; border-radius: 999px; background: var(--gray-100); color: var(--gray-500); font-size: 12px; font-weight: 800; }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .badge.green { color: #15803D; background: var(--green-soft); }
    .instruction-wrap { padding: 0 18px 28px; }
    .info-card { padding: 18px; margin-bottom: 14px; }
    .info-card h3 { margin:0 0 10px; font-size:18px; }
    .info-card p { margin:0; color: var(--gray-700); font-size:14px; line-height:1.75; }
    .metric-row { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-top:14px; }
    .metric { background: var(--red-soft); border-radius: 16px; padding: 13px; }
    .metric b { display:block; color: var(--red); font-size:22px; }
    .metric span { color: var(--gray-500); font-size:12px; font-weight:700; }
    .structure { width:100%; border-collapse:collapse; overflow:hidden; border-radius: 14px; font-size:13px; }
    .structure th { background: var(--red); color:white; padding:10px; text-align:center; }
    .structure td { background:#fff; border-bottom:1px solid var(--gray-200); padding:10px; text-align:center; color:var(--gray-700); }
    .part-card { min-height: 138px; display:flex; flex-direction:column; justify-content:space-between; }
    .part-index { width:42px; height:42px; border-radius:14px; background:var(--red-soft); color:var(--red); display:flex; align-items:center; justify-content:center; font-weight:900; }
    .part-main { flex:1; }
    .part-foot { display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
    .weak-btn { border:0; background: var(--gray-100); color: var(--gray-700); border-radius:999px; padding:8px 12px; font-size:12px; font-weight:800; cursor:pointer; }
    .loading-screen {
      position:absolute; inset:0; background: linear-gradient(155deg, #E6362B 0%, #B91C1C 100%); color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px;
    }
    .loader-card { width: 100%; padding: 28px 20px; border-radius: 28px; background:rgba(255,255,255,.16); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,.2); }
    .spinner { width:44px; height:44px; border:4px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; margin:0 auto 18px; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-card h2 { margin:0; font-size:28px; }
    .loader-card p { margin:8px 0 18px; color:rgba(255,255,255,.84); }
    .mini-info { background:rgba(255,255,255,.15); border-radius:16px; padding:12px; font-size:13px; line-height:1.65; }
    .quiz-page { position:absolute; inset:0; background: var(--gray-50); }
    .quiz-top { position:absolute; left:0; right:0; top:54px; height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; z-index:8; background:rgba(248,250,252,.86); backdrop-filter: blur(14px); }
    .timer { font-size:17px; font-weight:900; letter-spacing:.3px; }
    .quiz-body { position:absolute; top:102px; bottom:154px; left:0; right:0; overflow:auto; padding:16px 18px 24px; }
    .quiz-bottom { position:absolute; left:0; right:0; bottom:0; padding: 12px 18px 22px; background:rgba(255,255,255,.94); backdrop-filter: blur(18px); border-top:1px solid rgba(229,231,235,.82); }
    .nav-questions { display:grid; grid-template-columns: 88px 1fr 88px; align-items:center; gap:10px; margin-bottom:10px; }
    .outline-btn, .primary-btn, .ghost-btn { height:45px; border-radius:15px; border:0; font-weight:900; cursor:pointer; }
    .outline-btn { background:var(--gray-100); color:var(--gray-700); }
    .outline-btn:disabled { color:var(--gray-300); }
    .primary-btn { background: var(--red); color:#fff; box-shadow: 0 10px 20px rgba(217,48,37,.2); }
    .ghost-btn { background:#fff; color:var(--red); border:1px solid rgba(217,48,37,.22); }
    .quiz-actions { display:grid; grid-template-columns: 1fr 1.25fr; gap:10px; }
    .progress-text { text-align:center; color:var(--gray-500); font-weight:900; font-size:13px; }
    .question-title { font-size:18px; font-weight:900; margin-bottom:12px; }
    .question-card { padding:18px; }
    .q-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .q-no { color:var(--red); font-weight:900; }
    .v-sub { color:var(--gray-500); font-size:12px; font-weight:700; }
    .ruby-line { font-size:22px; line-height:2.1; letter-spacing:.6px; }
    ruby { ruby-align:center; }
    rt { font-size: 10px; color: var(--gray-500); letter-spacing:0; }
    .mock-image {
      height: 176px; border-radius:22px; background:linear-gradient(135deg,#fff8f7,#f0f7ff); border:1px solid rgba(229,231,235,.9); display:flex; align-items:center; justify-content:center; margin:14px 0; position:relative; overflow:hidden;
    }
    .mock-image .emoji { font-size:70px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.12)); }
    .mock-image span.label { position:absolute; bottom:12px; left:12px; background:rgba(255,255,255,.88); padding:6px 10px; border-radius:999px; color:var(--gray-500); font-size:12px; font-weight:800; }
    .option-list { display:grid; gap:10px; margin-top:14px; }
    .option { min-height:52px; border-radius:16px; border:1.5px solid var(--gray-200); background:#fff; display:flex; align-items:center; gap:10px; padding:12px; cursor:pointer; font-weight:750; }
    .option.active { border-color:var(--red); background:var(--red-soft); color:var(--red); }
    .option-key { width:30px; height:30px; border-radius:50%; background:var(--gray-100); display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--gray-500); flex:0 0 auto; }
    .option.active .option-key { background:var(--red); color:#fff; }

    .passage-box { background:#FFF7F5; border:1px solid #F6D2CD; border-radius:16px; padding:14px; color:var(--gray-700); line-height:1.85; font-size:15px; margin-bottom:12px; }
    .stem-box { font-size:18px; font-weight:800; line-height:1.9; color:var(--gray-900); }
    .hint-line { color:var(--gray-500); font-size:12px; font-weight:700; margin-top:6px; }
    .order-slots { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin:14px 0; }
    .order-slot { min-height:48px; border-radius:14px; border:1.5px dashed var(--gray-300); background:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--gray-500); cursor:pointer; padding:6px; text-align:center; }
    .order-slot.filled { border-style:solid; border-color:var(--red); background:var(--red-soft); color:var(--red); }
    .order-option-row { display:grid; gap:10px; }
    .option.used { opacity:.55; }
    .image-options { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
    .image-option { border-radius:18px; border:1.5px solid var(--gray-200); background:#fff; padding:10px; cursor:pointer; }
    .image-option.active { border-color:var(--red); background:var(--red-soft); }
    .image-tile { height:96px; border-radius:14px; background:linear-gradient(135deg,#f8fafc,#eef2ff); display:flex; align-items:center; justify-content:center; font-size:42px; }
    .image-option .option-key { margin-top:-16px; position:relative; box-shadow:0 6px 12px rgba(17,24,39,.12); }
    .answer-sheet, .modal-mask { position:absolute; inset:0; z-index:40; background:rgba(17,24,39,.35); display:none; }
    .answer-sheet.show, .modal-mask.show { display:block; }
    .sheet-panel { position:absolute; left:0; right:0; bottom:0; height:56%; background:#fff; border-radius:24px 24px 0 0; padding:16px 18px 22px; box-shadow:0 -18px 40px rgba(17,24,39,.16); }
    .sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .sheet-head h3 { margin:0; font-size:19px; }
    .close-x { border:0; background:var(--gray-100); width:34px; height:34px; border-radius:50%; font-size:20px; color:var(--gray-500); cursor:pointer; }
    .number-grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; margin-top:18px; max-height:180px; overflow:auto; padding-bottom:4px; }
    .q-circle { width:43px; height:43px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; border:1.5px solid var(--gray-300); color:var(--gray-500); background:#fff; cursor:pointer; }
    .q-circle.answered { background:var(--green); border-color:var(--green); color:#fff; }
    .q-circle.current { background:var(--red); border-color:var(--red); color:#fff; box-shadow:0 6px 14px rgba(217,48,37,.24); }
    .sheet-submit { position:absolute; left:18px; right:18px; bottom:22px; }
    .dialog { position:absolute; top:50%; left:26px; right:26px; transform:translateY(-50%); background:#fff; border-radius:22px; padding:20px; box-shadow:var(--shadow); }
    .dialog h3 { margin:0 0 8px; text-align:center; font-size:20px; }
    .dialog p { margin:0; color:var(--gray-500); text-align:center; font-size:14px; line-height:1.65; }
    .dialog-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
    .report-content { position:absolute; top:54px; bottom:0; left:0; right:0; overflow:auto; padding:0 18px 28px; }
    .report-hero { margin: 6px 0 16px; padding:24px 18px; color:white; border-radius:28px; background:linear-gradient(150deg,#E6362B,#B91C1C); text-align:center; box-shadow:0 14px 28px rgba(217,48,37,.22); }
    .report-hero b { font-size:48px; line-height:1; display:block; margin-bottom:8px; }
    .report-hero span { color:rgba(255,255,255,.86); font-weight:700; }
    .stats { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-bottom:14px; }
    .stat { padding:14px 8px; text-align:center; }
    .stat b { display:block; font-size:20px; margin-bottom:3px; }
    .stat span { color:var(--gray-500); font-size:11px; font-weight:800; }
    .answer-toolbar { display:flex; align-items:center; justify-content:space-between; margin:18px 0 12px; }
    .switch { display:flex; align-items:center; gap:8px; color:var(--gray-500); font-size:13px; font-weight:800; }
    .toggle { width:44px; height:26px; border-radius:999px; background:var(--gray-300); position:relative; cursor:pointer; transition:.2s; }
    .toggle::after { content:""; position:absolute; width:22px; height:22px; top:2px; left:2px; background:#fff; border-radius:50%; transition:.2s; }
    .toggle.on { background:var(--red); }
    .toggle.on::after { left:20px; }
    .result-grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; }
    .result-circle { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; cursor:pointer; }
    .result-circle.right { background:var(--green); }
    .result-circle.wrong { background:#EF4444; }
    .empty-state { text-align:center; padding:30px 12px; color:var(--gray-500); font-weight:800; }
    .analysis-dialog { position:absolute; left:18px; right:18px; top:86px; bottom:38px; background:#fff; border-radius:24px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; }
    .analysis-head { height:54px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--gray-200); position:relative; font-weight:900; }
    .analysis-head .close-x { position:absolute; left:12px; }
    .analysis-body { padding:16px; overflow:auto; }
    .answer-line { display:flex; gap:10px; margin:10px 0; }
    .answer-line div { flex:1; background:var(--gray-100); border-radius:14px; padding:12px; font-weight:800; }
    .answer-line span { display:block; color:var(--gray-500); font-size:12px; margin-bottom:4px; }
    .analysis-text { background:#FFF7ED; border:1px solid #FED7AA; border-radius:16px; padding:13px; color:#7C2D12; line-height:1.7; font-size:14px; }
    .home-indicator { position:absolute; left:50%; bottom:7px; transform:translateX(-50%); width:132px; height:5px; border-radius:999px; background:#111; opacity:.84; z-index:80; }
    @media (max-width: 820px) {
      body { padding: 14px; }
      .brief { display:none; }
      .phone-frame { transform: scale(.92); }
    }
    @media (max-width: 430px) {
      body { padding:0; background:#111; }
      .phone-frame { width:100vw; height:100vh; border-radius:0; padding:0; transform:none; }
      .phone { width:100vw; height:100vh; border-radius:0; }
      .dynamic-island { display:none; }
      .home-indicator { bottom:5px; }
    }
  
    .level-tabs { cursor: grab; user-select: none; }
    .level-tabs.dragging { cursor: grabbing; }
    .group-list { display:grid; gap:10px; margin-top:14px; }
    .group-item { width:100%; text-align:left; border:1.5px solid var(--gray-200); background:#fff; border-radius:16px; padding:12px; display:grid; grid-template-columns: 32px 1fr auto; gap:10px; align-items:center; cursor:pointer; }
    .group-item.active { border-color:var(--red); background:var(--red-soft); }
    .group-item.static-item { cursor:default; }
    .group-index { width:28px; height:28px; border-radius:50%; background:var(--gray-100); color:var(--gray-700); display:flex; align-items:center; justify-content:center; font-weight:900; }
    .group-text { font-size:14px; line-height:1.6; color:var(--gray-900); }
    .answer-tag { min-width:54px; text-align:center; border-radius:999px; padding:7px 10px; background:var(--gray-100); color:var(--gray-500); font-size:12px; font-weight:900; }
    .answer-tag.filled { background:var(--red); color:#fff; }
    .bank-title { margin:16px 0 10px; font-size:13px; font-weight:900; color:var(--gray-700); }
    .choice-bank { display:grid; gap:10px; }

function selectLevel(level){currentLevel=level;selectedPaper=paperMap[level][0];goHome()}
function getQuestionsByType(level,type,partIndex){
  const rows=(qBank[`${level}|${type}`]||[]);
  const filtered=rows.filter(q=>{
    if(type!=='细节选择题')return true;
    if(level==='HSK2'||level==='HSK3') return partIndex===2 ? q.variant==='short' : q.variant==='long';
    if(level==='HSK4') return partIndex===1 ? q.variant==='short' : q.variant==='long';
    if(level==='HSK5') return partIndex===0 ? q.variant==='short' : q.variant==='long';
    if(level==='HSK6') return partIndex===0 ? q.variant==='short' : q.variant==='interview';
    return true;
  });
  const demoCount=type==='图片匹配题'?6:(type==='听短文选择'?2:3);
  return filtered.slice(0,demoCount).map((q,i)=>({...q,no:i+1}));
}
function questionUnitsCount(q){return q.layout==='passageGroup'?(q.items||[]).length:1}
function getPartTotal(level,part,index){return getQuestionsByType(level,part[2],index).reduce((sum,q)=>sum+questionUnitsCount(q),0)}
function isQuestionComplete(q,answer=answers[q.questionId]){
  if(q.layout==='passageGroup')return (q.items||[]).every(item=>isQuestionComplete(item,answers[item.questionId]));
  return answer!==undefined&&answer!==null&&String(answer)!==''
}
function answerCount(){return currentQuestions.reduce((sum,q)=>sum+(q.layout==='passageGroup'?(q.items||[]).filter(item=>isQuestionComplete(item,answers[item.questionId])).length:(isQuestionComplete(q)?1:0)),0)}
function isCorrect(q,answer=answers[q.questionId]){
  if(q.layout==='passageGroup')return (q.items||[]).every(item=>isCorrect(item,answers[item.questionId]));
  return isQuestionComplete(q,answer)&&String(answer)===String(q.correct)
}
function getPartProgressStats(partId,part,level=currentLevel,index=0){
  const total=getPartTotal(level,part,index);const report=getPartReport(partId);
  if(report){return{total,done:total,right:report.correct||0,wrong:Math.max(0,total-(report.correct||0)),hasReport:true}}
  const saved=getSavedProgress(partId);
  const done=saved?getQuestionsByType(level,part[2],index).reduce((sum,q)=>sum+(q.layout==='passageGroup'?(q.items||[]).filter(item=>isQuestionComplete(item,saved.answers?.[item.questionId])).length:(isQuestionComplete(q,saved.answers?.[q.questionId])?1:0)),0):0;
  return{total,done,right:0,wrong:0,hasReport:false};
}
function getPaperProgressStats(p){const level=p.paperId.split('_')[0];return levelConfig[level].parts.reduce((sum,part,i)=>{const s=getPartProgressStats(`${p.paperId}_part_${i+1}`,part,level,i);sum.total+=s.total;sum.done+=s.done;return sum},{total:0,done:0})}
function paperCard(p){const s=getPaperProgressStats(p);const percent=s.total?Math.round(s.done/s.total*100):0;const status=percent>=100?'已完成':s.done>0?'练习中':'未开始';return `<article class="card paper-card" onclick="openPaper('${p.paperId}')"><div class="paper-row"><div><div class="paper-code">${p.paperCode}</div></div><div class="arrow">›</div></div><div class="progress-meta"><span>已完成 ${s.done}/${s.total}</span><span class="badge ${status==='已完成'?'green':status==='练习中'?'red':''}">${status}</span></div><div class="progress"><div style="width:${percent}%"></div></div></article>`}

  if(q.layout==='textJudge')return `<article class="card listening-question-card"><div class="q-meta"><span class="q-no">第 ${q.no} 题</span><span class="v-sub">${q.type}</span></div>${renderAudioPlayer(q,false,'题目音频')}<div class="spoken-statement">${q.statement}</div><div class="judge-options compact" data-answer-group="${q.questionId}"><button class="judge-option ${answers[q.questionId]==='true'?'active':''}" data-value="true" onclick="chooseAnswer('${q.questionId}','true')"><span class="judge-symbol">✓</span><span class="judge-label">正确</span></button><button class="judge-option ${answers[q.questionId]==='false'?'active':''}" data-value="false" onclick="chooseAnswer('${q.questionId}','false')"><span class="judge-symbol">×</span><span class="judge-label">错误</span></button></div></article>`;
  if(q.layout==='imageChoice')return `<article class="card listening-question-card"><div class="q-meta"><span class="q-no">第 ${q.no} 题</span><span class="v-sub">${q.type}</span></div>${renderAudioPlayer(q,false,'题目音频')}<div class="inline-answer-block"><div class="inline-answer-label">请选择答案</div><div class="inline-image-options" data-answer-group="${q.questionId}">${q.choices.map(c=>`<button class="inline-image-option ${answers[q.questionId]===c.key?'active':''}" data-value="${c.key}" onclick="chooseAnswer('${q.questionId}','${c.key}')"><div class="inline-image-tile">${c.image}</div><span class="inline-image-key">${c.key}</span></button>`).join('')}</div></div></article>`;
  if(q.layout==='textChoice')return `<article class="card listening-question-card"><div class="q-meta"><span class="q-no">第 ${q.no} 题</span><span class="v-sub">${q.type}</span></div>${renderAudioPlayer(q,false,'题目音频')}<div class="option-list" data-answer-group="${q.questionId}">${q.choices.map((c,i)=>{const key=String.fromCharCode(65+i);return `<button class="option ${answers[q.questionId]===key?'active':''}" data-value="${key}" onclick="chooseAnswer('${q.questionId}','${key}')"><span class="option-key">${key}</span><span>${renderRubyChoice(c)}</span></button>`}).join('')}</div></article>`;
  if(q.layout==='passageGroup')return `<article class="card listening-question-card passage-group-card"><div class="q-meta"><span class="q-no">材料 ${q.no}</span><span class="v-sub">${q.type}</span></div><div class="passage-fixed-material"><div class="material-label">材料音频</div>${renderAudioPlayer({questionId:`${q.questionId}_material`,audioText:q.materialAudioText},false,'材料音频')}</div><section class="passage-question-shell" id="passageQuestionPanel">${renderPassageQuestion(q)}</section></article>`;
  return `<article class="card listening-question-card"><div class="q-meta"><span class="q-no">第 ${q.no} 题</span><span class="v-sub">${q.type}</span></div>${renderAudioPlayer(q,false,'题目音频')}</article>`;

function renderPassageQuestion(group){const item=(group.items||[])[currentPassageItemIndex];if(!item)return '<div class="empty-state">暂无题目</div>';return `<div class="passage-question-head"><b>第 ${item.subNo} 题</b><span>${currentPassageItemIndex+1}/${group.items.length}</span></div><div class="material-label">题目音频</div>${renderAudioPlayer(item,false,'题目音频')}<div class="option-list" data-answer-group="${item.questionId}">${item.choices.map((c,i)=>{const key=String.fromCharCode(65+i);return `<button class="option ${answers[item.questionId]===key?'active':''}" data-value="${key}" onclick="chooseAnswer('${item.questionId}','${key}')"><span class="option-key">${key}</span><span>${renderRubyChoice(c)}</span></button>`}).join('')}</div>`}
function renderRubyChoice(choice){return choice.pinyin?`<ruby>${choice.text}<rt>${choice.pinyin}</rt></ruby>`:escapeHtml(choice.text)}
function renderAnswerDrawer(q){const usedValues=new Set(currentQuestions.filter(item=>item.questionId!==q.questionId).map(item=>answers[item.questionId]).filter(Boolean));const body=`<div class="drawer-prompt">第 ${q.no} 题选择图片，每张图片仅匹配一次</div><div class="drawer-choice-grid images" data-answer-group="${q.questionId}">${q.choices.map(c=>`<button class="drawer-image-choice ${answers[q.questionId]===c.key?'active':''} ${usedValues.has(c.key)?'used':''}" data-value="${c.key}" onclick="chooseAnswer('${q.questionId}','${c.key}')"><div class="drawer-image-tile">${c.image}</div><span class="drawer-image-key">${c.key}</span></button>`).join('')}</div>`;return `<aside class="answer-drawer" id="answerDrawer"><div class="drawer-handle" id="drawerHandle"><span class="drawer-handle-label">上下拖动</span></div><div class="drawer-body">${body}</div></aside>`}
function chooseAnswer(qid,value){const q=findQuestion(qid);if(q?.type==='图片匹配题'){currentQuestions.forEach(item=>{if(item.questionId!==qid&&answers[item.questionId]===value)delete answers[item.questionId]})}answers[qid]=value;saveCurrentProgress();const group=document.querySelector(`[data-answer-group="${qid}"]`);if(group){group.querySelectorAll('[data-value]').forEach(el=>el.classList.toggle('active',el.dataset.value===String(value)))}if(q?.type==='图片匹配题'){const drawer=document.getElementById('answerDrawer');if(drawer)drawer.outerHTML=renderAnswerDrawer(q);initAnswerDrawer()}}
function initAnswerDrawer(){const page=document.querySelector('.quiz-page.with-drawer');const drawer=document.getElementById('answerDrawer');const handle=document.getElementById('drawerHandle');if(!page||!drawer||!handle)return;let startY=0,startH=0,dragging=false;const move=y=>{if(!dragging)return;const next=Math.max(132,Math.min(430,startH+(startY-y)));page.style.setProperty('--drawer-h',`${next}px`)};handle.addEventListener('pointerdown',e=>{dragging=true;startY=e.clientY;startH=drawer.getBoundingClientRect().height;handle.setPointerCapture?.(e.pointerId)});handle.addEventListener('pointermove',e=>move(e.clientY));handle.addEventListener('pointerup',()=>dragging=false);handle.addEventListener('pointercancel',()=>dragging=false)}

function findQuestion(qid){
  if(reviewAudioSources[qid])return reviewAudioSources[qid];
  for(const q of currentQuestions){
    if(q.questionId===qid)return q;
    if(q.layout==='passageGroup'){
      const item=(q.items||[]).find(item=>item.questionId===qid);
      if(item)return item;
      if(`${q.questionId}_material`===qid)return {questionId:qid,audioText:q.materialAudioText,type:'材料音频',layout:'materialAudio'};
    }
  }
  return null
}
function scheduleAutoAudio(q){
  clearTimeout(audioAutoTimer);
  const targetId=q.layout==='passageGroup'?`${q.questionId}_material`:q.questionId;
  const status=document.getElementById(`audioStatus_${targetId}`);
  if(status)status.textContent=targetId.endsWith('_material')?'材料音频':'题目音频';
  audioAutoTimer=setTimeout(()=>playAudio(targetId,true),1200);
}
function chooseChineseVoice(){const voices=window.speechSynthesis?.getVoices?.()||[];return voices.find(v=>/^zh/i.test(v.lang)&&/CN|Hans/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang))||null}
function getBaseSpeechRate(){return currentLevel==='HSK1'?0.78:currentLevel==='HSK2'?0.86:currentLevel==='HSK3'?0.95:currentLevel==='HSK4'?1.03:currentLevel==='HSK5'?1.12:1.2}
function setAudioUi(qid,{playing=false,status='点击播放',progress=0,current=0,total=0}={}){const card=document.getElementById(`audio_${qid}`),btn=document.getElementById(`play_${qid}`),statusEl=document.getElementById(`audioStatus_${qid}`),fill=document.getElementById(`audioFill_${qid}`),time=document.getElementById(`audioTime_${qid}`);card?.classList.toggle('playing',playing);btn?.classList.toggle('playing',playing);if(btn)btn.textContent=playing?'❚❚':'▶';if(statusEl)statusEl.textContent=status;if(fill)fill.style.width=`${Math.max(0,Math.min(100,progress))}%`;if(time)time.textContent=`${fmtTime(current)} / ${total?fmtTime(total):'--:--'}`}
function resetAudioState(){activeAudioId=null;activeAudioPaused=false;activeAudioPlaying=false;activeAudioElapsed=0;activeAudioEstimated=0;activeAudioStartedAt=0;activeAudioUsesSimulation=false}
function stopAudio(){clearTimeout(audioAutoTimer);clearInterval(audioProgressTimer);clearTimeout(audioSimulationTimer);audioSessionToken++;try{window.speechSynthesis?.cancel()}catch{}document.querySelectorAll('.audio-player-card').forEach(el=>el.classList.remove('playing'));document.querySelectorAll('.audio-play-btn').forEach(el=>{el.classList.remove('playing');el.textContent='▶'});document.querySelectorAll('[id^="audioStatus_"]').forEach(el=>{if(el.textContent==='播放中'||el.textContent==='已暂停'||el.textContent==='播放完成')el.textContent=el.id.includes('_material')?'材料音频':'题目音频'});resetAudioState()}
function refreshAudioProgress(qid,token){clearInterval(audioProgressTimer);audioProgressTimer=setInterval(()=>{if(token!==audioSessionToken||!activeAudioPlaying)return;const current=Math.min(activeAudioEstimated,activeAudioElapsed+(Date.now()-activeAudioStartedAt)/1000);setAudioUi(qid,{playing:true,status:'播放中',progress:activeAudioEstimated?current/activeAudioEstimated*100:0,current,total:activeAudioEstimated})},100)}
function finishAudio(qid,token){if(token!==audioSessionToken)return;clearInterval(audioProgressTimer);clearTimeout(audioSimulationTimer);activeAudioElapsed=activeAudioEstimated;activeAudioPlaying=false;activeAudioPaused=false;setAudioUi(qid,{playing:false,status:'点击播放',progress:100,current:activeAudioEstimated,total:activeAudioEstimated})}
function startSimulatedAudio(qid,token){clearTimeout(audioSimulationTimer);const remaining=Math.max(0.1,activeAudioEstimated-activeAudioElapsed);audioSimulationTimer=setTimeout(()=>finishAudio(qid,token),remaining*1000)}
function playAudio(qid,isAuto=false){
  const q=findQuestion(qid);if(!q)return;
  clearTimeout(audioAutoTimer);
  if(activeAudioId===qid&&activeAudioPlaying){
    activeAudioElapsed=Math.min(activeAudioEstimated,activeAudioElapsed+(Date.now()-activeAudioStartedAt)/1000);
    activeAudioPlaying=false;activeAudioPaused=true;clearInterval(audioProgressTimer);clearTimeout(audioSimulationTimer);
    try{window.speechSynthesis?.pause()}catch{}
    setAudioUi(qid,{playing:false,status:'已暂停',progress:activeAudioEstimated?activeAudioElapsed/activeAudioEstimated*100:0,current:activeAudioElapsed,total:activeAudioEstimated});
    return;
  }
  if(activeAudioId===qid&&activeAudioPaused){
    activeAudioPaused=false;activeAudioPlaying=true;activeAudioStartedAt=Date.now();
    try{window.speechSynthesis?.resume()}catch{}
    setAudioUi(qid,{playing:true,status:'播放中',progress:activeAudioEstimated?activeAudioElapsed/activeAudioEstimated*100:0,current:activeAudioElapsed,total:activeAudioEstimated});
    refreshAudioProgress(qid,audioSessionToken);if(activeAudioUsesSimulation)startSimulatedAudio(qid,audioSessionToken);
    return;
  }
  stopAudio();
  const speechRate=getBaseSpeechRate()*(slowMode?0.5:1);
  const rawText=(q.audioText||'').trim();
  activeAudioId=qid;activeAudioEstimated=Math.max(2.5,Math.min(18,rawText.length*.18/(slowMode?0.5:1)));activeAudioElapsed=0;activeAudioStartedAt=Date.now();activeAudioPlaying=true;activeAudioPaused=false;
  const token=audioSessionToken;
  setAudioUi(qid,{playing:true,status:'播放中',progress:0,current:0,total:activeAudioEstimated});
  refreshAudioProgress(qid,token);
  if('speechSynthesis'in window&&'SpeechSynthesisUtterance'in window){
    const u=new SpeechSynthesisUtterance(rawText);u.lang='zh-CN';u.rate=speechRate;u.pitch=1;const voice=chooseChineseVoice();if(voice)u.voice=voice;
    u.onend=()=>finishAudio(qid,token);
    u.onerror=()=>{if(token!==audioSessionToken)return;activeAudioUsesSimulation=true;startSimulatedAudio(qid,token)};
    window.speechSynthesis.speak(u);
  }else{activeAudioUsesSimulation=true;startSimulatedAudio(qid,token)}
}
function toggleSlowMode(){
  const restartId=activeAudioId;
  const shouldRestart=Boolean(restartId&&(activeAudioPlaying||activeAudioPaused));
  slowMode=!slowMode;
  const btn=document.getElementById('speedToggle');
  if(btn){
    btn.textContent=slowMode?'0.5×':'1×';
    btn.classList.toggle('slow-on',slowMode);
    btn.title=`当前播放速度：${slowMode?'0.5倍':'正常速度'}`;
  }
  if(shouldRestart){stopAudio();playAudio(restartId)}
}

function refreshPassageQuestionView(){const q=currentQuestions[currentQuestionIndex];if(q?.layout!=='passageGroup'){renderQuiz();return}const materialId=`${q.questionId}_material`;if(activeAudioId!==materialId)stopAudio();const panel=document.getElementById('passageQuestionPanel');if(panel)panel.innerHTML=renderPassageQuestion(q);const navEl=document.getElementById('quizNavigation');if(navEl)navEl.innerHTML=renderQuizNavigation();saveCurrentProgress()}
function prevQuestion(){
  const q=currentQuestions[currentQuestionIndex];
  if(q?.layout==='passageGroup'&&currentPassageItemIndex>0){currentPassageItemIndex--;refreshPassageQuestionView();return}
  if(currentQuestionIndex>0){currentQuestionIndex--;const prev=currentQuestions[currentQuestionIndex];currentPassageItemIndex=prev?.layout==='passageGroup'?Math.max(0,(prev.items||[]).length-1):0;saveCurrentProgress();renderQuiz()}
}
function nextQuestion(){
  const q=currentQuestions[currentQuestionIndex];
  if(q?.layout==='passageGroup'&&currentPassageItemIndex<(q.items||[]).length-1){currentPassageItemIndex++;refreshPassageQuestionView();return}
  if(currentQuestionIndex<currentQuestions.length-1){currentQuestionIndex++;currentPassageItemIndex=0;saveCurrentProgress();renderQuiz()}
}
function getQuestionNavEntries(){let number=0;return currentQuestions.flatMap((q,groupIndex)=>q.layout==='passageGroup'?(q.items||[]).map((item,itemIndex)=>({number:++number,groupIndex,itemIndex,question:item})):([{number:++number,groupIndex,itemIndex:0,question:q}]))}
function showAnswerSheet(){const sheet=document.getElementById('answerSheet');if(!sheet)return;const entries=getQuestionNavEntries();sheet.innerHTML=`<div class="sheet-panel"><div class="sheet-head"><div><h3>答题卡</h3><div class="sub">已完成 ${answerCount()}/${entries.length}</div></div><button class="close-x" onclick="hideAnswerSheet()">×</button></div><div class="number-grid">${entries.map(entry=>`<button class="q-circle ${isQuestionComplete(entry.question,answers[entry.question.questionId])?'answered':''} ${entry.groupIndex===currentQuestionIndex&&entry.itemIndex===currentPassageItemIndex?'current':''}" onclick="jumpQuestionUnit(${entry.groupIndex},${entry.itemIndex})">${entry.number}</button>`).join('')}</div><button class="primary-btn sheet-submit" onclick="hideAnswerSheet();showSubmitModal()">提交答案</button></div>`;sheet.classList.add('show')}

function jumpQuestionUnit(groupIndex,itemIndex=0){const samePassage=groupIndex===currentQuestionIndex&&currentQuestions[groupIndex]?.layout==='passageGroup';currentQuestionIndex=groupIndex;currentPassageItemIndex=itemIndex;hideAnswerSheet();saveCurrentProgress();if(samePassage)refreshPassageQuestionView();else renderQuiz()}
function jumpQuestion(i){jumpQuestionUnit(i,0)}
function showExitModal(){stopAudio();const m=document.getElementById('modalMask');m.innerHTML=`<div class="dialog"><button class="close-x" style="position:absolute;left:14px;top:14px" onclick="closeModal()">×</button><h3>退出练习</h3><p>确定退出当前练习吗？退出时将自动保存当前作答记录，下次进入可继续作答。</p><div class="dialog-actions"><button class="outline-btn" onclick="closeModal()">取消</button><button class="primary-btn" onclick="abandonQuiz()">确定</button></div></div>`;m.classList.add('show')}
function closeModal(){if(document.querySelector('.analysis-dialog')){stopAudio();reviewAudioSources={}}document.getElementById('modalMask')?.classList.remove('show')}
function abandonQuiz(){saveCurrentProgress();closeModal();stopTimer();stopAudio();quizStartedAt=null;elapsedSeconds=0;currentQuestions=[];currentPassageItemIndex=0;renderParts()}
function showSubmitModal(){stopAudio();const completed=answerCount();const total=getPartTotal(currentLevel,[currentPart.partName,currentPart.count,currentPart.questionType],currentPart.partIndex);const left=total-completed;const m=document.getElementById('modalMask');m.innerHTML=`<div class="dialog"><h3>确认提交</h3><p>已完成 ${completed}/${total}<br>${left?`还有 ${left} 题未完成，仍要提交吗？`:'已完成全部题目，提交后可查看学习报告。'}</p><div class="dialog-actions"><button class="outline-btn" onclick="closeModal()">继续答题</button><button class="primary-btn" onclick="submitQuiz()">确认提交</button></div></div>`;m.classList.add('show')}
function buildReportRows(){
  return currentQuestions.flatMap(q=>{
    if(q.layout==='passageGroup'){
      return (q.items||[]).map(item=>({
        ...item,
        type:q.type,
        title:q.title,
        prompt:item.prompt,
        userAnswer:answers[item.questionId]??null,
        completed:isQuestionComplete(item),
        isRight:isCorrect(item),
        groupNo:q.no,
        materialAudioText:q.materialAudioText,
        materialHidden:true,
        layout:'textChoice'
      }))
    }
    return [{...q,userAnswer:answers[q.questionId]??null,completed:isQuestionComplete(q),isRight:isCorrect(q)}]
  })
}
function submitQuiz(){stopTimer();stopAudio();const answered=answerCount();const rows=buildReportRows();latestReport={reportId:`listening_report_${Date.now()}`,partId:currentPart.partId,total:getPartTotal(currentLevel,[currentPart.partName,currentPart.count,currentPart.questionType],currentPart.partIndex),completed:rows.length,answered,correct:rows.filter(r=>r.isRight).length,duration:elapsedSeconds,rows};savePartReport(latestReport);clearSavedProgress(currentPart.partId);quizStartedAt=null;elapsedSeconds=0;renderReport()}
function showPartReport(partId){const report=getPartReport(partId);if(!report)return;latestReport=report;renderReport()}
function demoReport(){currentLevel='HSK1';selectedPaper=paperMap.HSK1[0];const part=levelConfig.HSK1.parts[0];currentQuestions=getQuestionsByType('HSK1',part[2],0);currentPart={partId:`${selectedPaper.paperId}_part_1`,partIndex:0,partName:part[0],questionType:part[2],count:currentQuestions.length};answers={};currentQuestions.forEach(q=>answers[q.questionId]=q.correct);elapsedSeconds=68;submitQuiz()}
function renderReport(){stopTimer();stopAudio();if(!latestReport){demoReport();return}const percent=latestReport.total?Math.round(latestReport.correct/latestReport.total*100):0;app.innerHTML=`<div class="quiz-page">${statusBar()}${nav('学习报告',`<button class="nav-btn" onclick="renderParts()">×</button>`,'<span></span>')}<div class="report-content"><section class="report-hero"><b>${percent}%</b><span>正确率</span><small>答对 ${latestReport.correct} 题，共 ${latestReport.total} 题</small></section><section class="stats"><div class="card stat"><b>${fmtTime(latestReport.duration)}</b><span>答题时间</span></div><div class="card stat"><b>${latestReport.correct}/${latestReport.total}</b><span>答对情况</span></div></section><div class="answer-toolbar"><h3 style="margin:0">答题回顾</h3></div><section class="card info-card"><div class="result-grid">${latestReport.rows.map((r,i)=>`<button class="result-circle ${r.isRight?'right':'wrong'}" onclick="openListeningReview(${i})">${i+1}</button>`).join('')}</div></section></div><div id="modalMask" class="modal-mask"></div></div>`}
function formatAnswer(row,value){if(value===null||value===undefined||value==='')return '未作答';if(row.layout==='imageJudge'||row.layout==='textJudge')return String(value)==='true'?'正确':'错误';if(row.layout==='imageChoice'||row.layout==='imageMatch')return String(value);const idx=String(value).charCodeAt(0)-65;return row.choices?.[idx]?.text?`${value} ${row.choices[idx].text}`:String(value)}
function renderReviewFlags(isUser,isCorrect){
  if(isUser&&isCorrect)return '<span class="review-flag correct">你的答案 · 正确</span>';
  return `${isUser?'<span class="review-flag user">你的答案</span>':''}${isCorrect?'<span class="review-flag correct">正确答案</span>':''}`
}
function renderReviewChoices(row){
  if(row.layout==='imageJudge'||row.layout==='textJudge'){
    const judgeChoices=[{key:'A',text:'正确',value:'true'},{key:'B',text:'错误',value:'false'}];
    return `<div class="review-option-list">${judgeChoices.map(c=>{const isUser=String(row.userAnswer)===c.value;const isCorrect=String(row.correct)===c.value;return `<div class="review-option-item ${isCorrect?'correct':''} ${isUser?'user-picked':''}"><span class="option-key">${c.key}</span><span>${c.text}</span><span class="review-option-flags">${renderReviewFlags(isUser,isCorrect)}</span></div>`}).join('')}</div>`
  }
  if(row.layout==='imageChoice'||row.layout==='imageMatch'){
    const list=row.choices||[];return `<div class="review-option-list">${list.map(c=>{const isUser=String(row.userAnswer)===c.key;const isCorrect=String(row.correct)===c.key;return `<div class="review-option-item ${isCorrect?'correct':''} ${isUser?'user-picked':''}"><span class="option-key">${c.key}</span><span style="font-size:26px">${c.image||''}</span><span>${c.label||''}</span><span class="review-option-flags">${renderReviewFlags(isUser,isCorrect)}</span></div>`}).join('')}</div>`
  }
  return `<div class="review-option-list">${(row.choices||[]).map((c,i)=>{const key=String.fromCharCode(65+i);const isUser=String(row.userAnswer)===key;const isCorrect=String(row.correct)===key;return `<div class="review-option-item ${isCorrect?'correct':''} ${isUser?'user-picked':''}"><span class="option-key">${key}</span><span>${escapeHtml(c.text)}</span><span class="review-option-flags">${renderReviewFlags(isUser,isCorrect)}</span></div>`}).join('')}</div>`

function renderReviewAudio(row){
  reviewAudioSources={};
  const blocks=[];
  if(row.type==='听短文选择'&&row.materialAudioText){
    const materialId=`review_material_${row.questionId}`;
    reviewAudioSources[materialId]={questionId:materialId,audioText:row.materialAudioText,type:'材料音频',layout:'materialAudio'};
    blocks.push(`<div class="review-audio-block"><div class="review-audio-label">材料音频</div>${renderAudioPlayer(reviewAudioSources[materialId],false,'材料音频')}</div>`);
  }
  if(row.audioText){
    const questionId=`review_question_${row.questionId}`;
    reviewAudioSources[questionId]={questionId,audioText:row.audioText,type:'题目音频',layout:'reviewAudio'};
    blocks.push(`<div class="review-audio-block"><div class="review-audio-label">题目音频</div>${renderAudioPlayer(reviewAudioSources[questionId],false,'题目音频')}</div>`);
  }
  return blocks.length?`<div class="review-audio-stack">${blocks.join('')}</div>`:'';
}
function openListeningReview(index){
  stopAudio();
  const row=latestReport.rows[index];
  const m=document.getElementById('modalMask');
  const unanswered=row.userAnswer===null||row.userAnswer===undefined||row.userAnswer==='';
  m.innerHTML=`<div class="analysis-dialog"><div class="analysis-head"><button class="close-x" onclick="closeModal()">×</button>${row.type} 第 ${index+1} 题</div><div class="analysis-body"><div class="review-card"><div class="review-section-title">题干</div>${row.type==='听短文选择'?'':`<div class="question-title" style="margin-bottom:10px">${row.prompt||row.title}</div>`}${renderReviewAudio(row)}${row.image?`<div class="mock-image"><span class="emoji">${row.image}</span></div>`:''}${row.statement?`<div class="spoken-statement">${row.statement}</div>`:''}<div class="review-section-title" style="margin-top:8px">选项</div>${renderReviewChoices(row)}${unanswered?'<div class="review-unanswered">本题未作答，正确答案已在选项中标出</div>':''}</div><div class="review-card"><div class="review-section-title">解析</div><div class="analysis-text">${row.layout==='textChoice'&&row.type==='听短文选择'?'本题采用材料音频与题目音频分离：材料与题目均只通过音频播放，不展示对应文字；同一材料下的小题可逐题切换，材料播放器保持在页面上方。':'本原型使用浏览器语音合成模拟听力音频。正式开发时由后端返回音频地址、标准答案和解析内容，前端按当前结构展示。'}</div></div></div></div>`;
  m.classList.add('show')
}
function startTimer(){stopTimer();if(!quizStartedAt)quizStartedAt=Date.now();timerHandle=setInterval(()=>{elapsedSeconds=Math.floor((Date.now()-quizStartedAt)/1000);updateTimerText()},1000)}
function stopTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null}
function updateTimerText(){const el=document.getElementById('timerText');if(el)el.textContent=fmtTime(elapsedSeconds)}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function resetDemo(){stopTimer();stopAudio();currentLevel='HSK1';instructionLevel='HSK1';selectedPaper=paperMap.HSK1[0];currentPart=null;currentQuestions=[];currentQuestionIndex=0;currentPassageItemIndex=0;answers={};latestReport=null;quizStartedAt=null;elapsedSeconds=0;clearAllLocalDemoData();goHome()}
window.onload=renderAppHome;
</script>
